name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/screenshots/**"]
  pull_request:
  workflow_dispatch:

# Two runs of the same branch add nothing; keep the newest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback, no toolchain needed: source structure and content catalog.
  structure:
    name: Structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify (quick)
        run: ./Tools/verify.sh --quick

  # Proves the simulation core really is platform-agnostic: Foundation only, no Apple frameworks.
  core-linux:
    name: ParkLifeCore (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Verify
        run: ./Tools/verify.sh

  # The real target: core build, core tests and the iOS app, in one runner.
  apple:
    name: Core + iOS app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          swift --version
      - name: Verify (including the app)
        run: ./Tools/verify.sh --app

  # Captures the real app running in a simulator and commits the images.
  #
  # Deliberately independent of the `apple` job rather than gated behind it: that job also runs the
  # test suite, and a failing test does not stop the app from building and being worth looking at.
  # The capture script builds the app itself and exits non-zero if that fails, so an image can
  # still only come from a version that compiled.
  screenshots:
    name: Screenshots (simulator)
    runs-on: macos-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Select the newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Available simulators
        run: xcrun simctl list devices available | head -40
      - name: Capture
        run: ./Tools/capture_screenshots.sh docs/screenshots
      - name: Upload as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parklife-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Upload app logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parklife-screenshot-logs
          path: .build/screenshot-logs/*.log
          if-no-files-found: warn
      - name: Commit the images
        run: |
          if [ -z "$(git status --porcelain docs/screenshots)" ]; then
            echo "no screenshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "docs: capture screenshots from the simulator [skip ci]"
          git push
