name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Fast structural pass that runs anywhere, including without a Swift toolchain.
  structure:
    name: Source structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift sources
        run: python3 Tools/check_sources.py
      - name: Validate content catalog JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          failed = False
          for path in sorted(pathlib.Path("Sources/ParkLifeCore/Resources/Catalog").glob("*.json")):
              try:
                  json.load(open(path))
                  print(f"ok   {path}")
              except Exception as error:
                  print(f"FAIL {path}: {error}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  # The real answer: does the simulation compile and do its tests pass?
  core-linux:
    name: ParkLifeCore (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  core-macos:
    name: ParkLifeCore (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  app:
    name: iOS app
    runs-on: macos-14
    needs: core-macos
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project App/ParkLife.xcodeproj \
            -scheme ParkLife \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO
